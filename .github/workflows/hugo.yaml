name: Build CV PDF and deploy Hugo site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Generate CV PDF and build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUGO_VERSION: 0.167.0
      HUGO_ENVIRONMENT: production
      TZ: Asia/Tokyo
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Go for Hugo Modules
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install Hugo CLI
        run: |
          curl --fail --location --output "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
      - name: Download locked theme module
        run: go mod download
      - name: Install Chrome for CV rendering
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Read GitHub Pages URL
        id: pages
        uses: actions/configure-pages@v6
      - name: Generate CV PDF and build Hugo site
        env:
          CV_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
          # Chrome renders only the trusted local CV preview in this CI job.
          CV_BROWSER_NO_SANDBOX: "1"
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: bash scripts/build-site.sh "$PAGES_BASE_URL"
      - name: Upload PDF build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: cv-build-diagnostics
          path: |
            out/cv-pdf-render.log
            out/cv-preview-server.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload generated CV PDF
        uses: actions/upload-artifact@v6
        with:
          name: curriculum-vitae
          path: static/downloads/curriculum-vitae.pdf
          if-no-files-found: error
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    name: Deploy built site to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
