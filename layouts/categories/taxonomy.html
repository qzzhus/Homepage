{{- define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
</header>
<div class="category-archive">
  {{- range .Data.Terms.Alphabetical }}
  {{- $category := .Page }}
  <section class="archive-year category-group" aria-label="{{ $category.LinkTitle }}">
    <h2 class="archive-year-header category-heading">
      <a class="category-link" href="{{ $category.RelPermalink }}">{{ $category.LinkTitle }}</a>
      <sup class="archive-count">{{ .Count }}</sup>
    </h2>
    <div class="archive-posts">
      {{- range .Pages.ByDate.Reverse }}
      <div class="archive-entry">
        <h3 class="archive-entry-title">{{ .Title | markdownify }}</h3>
        <div class="archive-meta">{{ partial "post_meta.html" . }}</div>
        <a class="entry-link" aria-label="Read {{ .Title | plainify }}" href="{{ .RelPermalink }}"></a>
      </div>
      {{- end }}
    </div>
  </section>
  {{- end }}
</div>
{{- end }}
